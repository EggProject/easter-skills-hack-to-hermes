# .pre-commit-config.yaml — canonical local quality gate
#
# SCOPE: runs on Python source/tests/tools, shell wrappers, and legacy plan docs
# if a future branch reintroduces docs/plans/*.md.
#
# HOOKS (in order of strictness):
#   1. wemake-python-styleguide (rev 1.6.2) — strictest Python linter
#   2. flake8 (strictest) — secondary strictest Python lint
#   3. ruff + ruff-format — fast lint + format
#   4. black — secondary formatter
#   5. mypy --strict — static type check
#   6. check-line-count — legacy docs/plans cap + footer checks when plan docs exist

repos:
  - repo: local
    hooks:
      # DEVIATION (JUSTIFIED, operator-authorized): check_bilingual hook removed
      # because the skill-creator migration stays English-only (user decision
      # recorded in plan D25 — "csak angol verzio kell"). The hook was an
      # organizational preference for Hungarian-English bilingual console output
      # in the previous Hermes port; the migrated skill does not require
      # localization. See ~/.claude/plans/frolicking-coalescing-reef.md D25.
      - id: check-line-count
        name: Legacy docs/plans 500-line cap + footer drift + budget table Total + per-cell guard
        entry: python3 tools/check_line_count.py --enforce-footer --enforce-budget-table --enforce-per-cell
        language: system
        files: '^docs/plans/.*\.md$'
        pass_filenames: false

      - id: bats
        name: bats smoke tests for scripts/ and tests/bats/
        entry: bash -c 'bats tests/bats/'
        language: system
        pass_filenames: false
        files: '^tests/bats/.*\.bats$'

  - repo: https://github.com/wemake-services/wemake-python-styleguide
    rev: 1.6.2
    hooks:
      - id: wemake-python-styleguide
        args:
          - --max-line-length=120
        files: '^src/.*\.py$'

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --max-complexity=10
          - --select=E,W,F,C
          - --extend-select=B,PIE,Q,I,N,D,SIM,RSE,RET,ARG,SLF
          - --show-source
          - --statistics
        files: '^src/.*\.py$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: '^(src/|tests/|tools/).*\.py$'
      - id: ruff-format
        files: '^(src/|tests/|tools/).*\.py$'

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3.14
        args: ["--line-length=120"]
        files: '^(src/|tests/|tools/).*\.py$'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [click, ruamel.yaml, types-PyYAML, pytest, python-frontmatter]
        args: ["--strict"]
        files: '^src/.*\.py$'

  # shellcheck: local binary (NOT shellcheck-precommit Docker image — the user
  # macOS dev environment has no Docker; on CI ubuntu, `apt-get install shellcheck`
  # makes the `shellcheck` binary available in PATH for the system hook).
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck (local shellcheck binary)
        entry: bash -c 'shellcheck --severity=warning scripts/*.sh'
        language: system
        pass_filenames: false
        files: '^scripts/.*\.sh$'
